name: Regenerate PocketBudget documentation screenshots

on:
  push:
    branches: [main, master]
    paths:
      - "scripts/generate_screenshots.py"
      - ".github/workflows/regenerate-doc-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate screenshots from application output
        run: python scripts/generate_screenshots.py

      - name: Commit terminal screenshots only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/main-menu.png
          git add docs/screenshots/add-expense.png
          git add docs/screenshots/error-handling.png
          git add docs/screenshots/budget-status.png
          git add docs/screenshots/monthly-report.png
          git add docs/screenshots/spending-analysis.png
          git add docs/screenshots/csv-export.png
          git add docs/screenshots/pytest-passed.png
          if git diff --cached --quiet; then
            echo "Terminal screenshots are already up to date."
          else
            git commit -m "Replace terminal screenshots with Windows Terminal captures"
            git push
          fi
